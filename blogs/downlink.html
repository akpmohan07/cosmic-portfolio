<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Downlink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #020a04;
    --g: #39ff7a;                     /* green phosphor, bright */
    --gd: #34c766;                    /* dim (labels) */
    --gf: #0f3a1d;                    /* faint */
    --glow: rgba(57, 255, 122, 0.55);
    --bad: #ff5a4f;
  }

  html, body { height: 100%; }

  body {
    background: #000;
    color: var(--g);
    font-family: "VT323", ui-monospace, Menlo, monospace;
    font-size: 17px;
    line-height: 1.3;
    letter-spacing: 0.02em;
    padding: 10px;
  }

  .crt {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: calc(100% - 0px);
    overflow: hidden;
    background: var(--bg);
    border-left: 3px solid var(--g);
    padding: 14px 18px 14px 16px;
    text-shadow: 0 0 2px var(--glow);
    text-transform: uppercase;
  }
  .crt::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.14) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55));
  }

  .ln { opacity: 0; }
  .ln.on { opacity: 1; }
  .d { color: var(--gd); }
  .f { color: #1d7a3e; letter-spacing: 0.04em; }
  .hex { font-size: 0.8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 3px rgba(57,255,122,0.35); }
  .bad { color: var(--bad); text-shadow: 0 0 4px rgba(255,90,79,0.5); }

  .row { display: flex; gap: 10px; }
  .row .k { flex: 0 0 52px; color: var(--gd); }
  .row .v { min-width: 0; overflow-wrap: anywhere; }
  .gap { height: 6px; }
  .v a { color: inherit; text-decoration: underline dotted var(--gd); text-underline-offset: 3px; }
  .v a:hover { text-decoration-color: var(--g); }

  .copy { margin-left: 10px; }
  .wxk { color: var(--gd); }
  .emo { font-size: 0.68em; vertical-align: 0.08em; text-shadow: none; }   /* emoji draw much larger than the pixel font */
  .copy {
    background: none;
    border: 1px solid var(--gd);
    color: var(--g);
    font: inherit;
    font-size: 0.85em;
    text-transform: inherit;
    text-shadow: inherit;
    padding: 0 6px;
    cursor: pointer;
  }
  .copy:hover, .copy:focus-visible { background: var(--g); color: #021006; text-shadow: none; outline: none; }

  .cur {
    display: inline-block;
    width: 10px;
    height: 17px;
    background: var(--g);
    vertical-align: -2px;
    margin-left: 4px;
    box-shadow: 0 0 6px var(--g);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 480px) {
    body { font-size: 15px; padding: 8px; }
    .crt { padding: 12px 12px 12px 12px; }
    .row .k { flex-basis: 44px; }
    .hex { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
</style>
</head>
<body>
  <div class="crt" id="out"></div>

<script src="shared/orbits.js"></script>
<script src="shared/olp.js"></script>
<script>
  // Orbit Downlink: renders an Orbit Log entry from an OLP-1 packet given as hex in ?p=
  // Packet format: docs/olp-1.md (codec in shared/olp.js, orbit list in shared/orbits.js)
  var EPOCH = OLP.EPOCH;

  var out = document.getElementById("out");
  var lines = [];

  function line(cls) {
    var el = document.createElement("div");
    el.className = "ln" + (cls ? " " + cls : "");
    out.appendChild(el);
    lines.push(el);
    return el;
  }
  function text(cls, t) { var el = line(cls); el.textContent = t; return el; }
  function row(k, v) {
    var el = line("row");
    var a = document.createElement("span"); a.className = "k"; a.textContent = k;
    var b = document.createElement("span"); b.className = "v"; b.textContent = v;
    el.append(a, b);
    return b;
  }
  function pad(n, w) { return String(n).padStart(w, "0"); }
  function hex(bytes) { return OLP.toHex(bytes, " "); }

  // Decode, then turn codes into names for display
  function decode(hexString) {
    var p = OLP.decode(OLP.fromHex(hexString));
    if (p.error) return p;
    var o = orbitByCode(p.orbit);
    p.orbitName = o ? o.name : "ORBIT " + p.orbit;
    p.emoji = o ? o.emoji : "";
    p.zoneName = OLP.ZONES[p.zone] || "UTC";
    return p;
  }

  // Real conditions at the spot and hour, from Open-Meteo (WMO weather codes)
  var WMO = { 0: "clear", 1: "mainly clear", 2: "partly cloudy", 3: "overcast", 45: "fog", 48: "freezing fog",
    51: "light drizzle", 53: "drizzle", 55: "heavy drizzle", 56: "freezing drizzle", 57: "freezing drizzle",
    61: "light rain", 63: "rain", 65: "heavy rain", 66: "freezing rain", 67: "freezing rain",
    71: "light snow", 73: "snow", 75: "heavy snow", 77: "snow grains", 80: "rain showers", 81: "rain showers",
    82: "heavy showers", 85: "snow showers", 86: "snow showers", 95: "thunderstorm", 96: "thunderstorm, hail", 99: "thunderstorm, hail" };

  function fetchWeather(p, cell) {
    var t = new Date(EPOCH + p.met * 1000);
    var day = t.toISOString().slice(0, 10);
    var recent = Date.now() - t.getTime() < 80 * 86400000;
    var url = (recent ? "https://api.open-meteo.com/v1/forecast" : "https://archive-api.open-meteo.com/v1/archive") +
      "?latitude=" + p.lat + "&longitude=" + p.lon + "&start_date=" + day + "&end_date=" + day +
      "&hourly=temperature_2m,weather_code,wind_speed_10m&timezone=GMT";
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      var h = d.hourly, i = h && h.time ? h.time.indexOf(day + "T" + pad(t.getUTCHours(), 2) + ":00") : -1;
      if (i < 0 || h.temperature_2m[i] == null) throw new Error("no data");
      cell.textContent = Math.round(h.temperature_2m[i]) + "°C · " + (WMO[h.weather_code[i]] || "code " + h.weather_code[i]) +
        " · wind " + Math.round(h.wind_speed_10m[i]) + " km/h";
    }).catch(function () { cell.parentNode.remove(); });
  }

  function render(p) {
    if (p.error) {
      text("d", ">> DOWNLINK");
      text("bad", ">> " + p.error);
      if (p.bytes) text("f hex", hex(p.bytes.slice(0, 20)) + " …");
      var w = line("d"); w.textContent = ">> AWAITING SIGNAL"; w.insertAdjacentHTML("beforeend", '<span class="cur"></span>');
      return;
    }

    var t = new Date(EPOCH + p.met * 1000);
    var fmt = function (opts) {
      return new Intl.DateTimeFormat("en-IE", Object.assign({ timeZone: p.zoneName }, opts)).format(t);
    };
    var time = fmt({ hour: "2-digit", minute: "2-digit", hour12: false });
    var zone = fmt({ timeZoneName: "short" }).split(" ").pop();
    var date = fmt({ weekday: "short", day: "numeric", month: "short", year: "numeric" });
    var ll = Math.abs(p.lat).toFixed(2) + (p.lat >= 0 ? "N" : "S") + " " +
             pad(Math.abs(p.lon).toFixed(2), 6) + (p.lon >= 0 ? "E" : "W");

    // Header: log, orbit + entry, local time and date
    var head = line("d");
    head.append(">> PKT " + pad(p.log, 3) + " · ");
    if (p.emoji) {
      var emo = document.createElement("span");
      emo.className = "emo";
      emo.textContent = p.emoji;
      head.append(emo, " ");
    }
    head.append(p.orbitName + " " + pad(p.entry, 3) + " · " + time + " " + zone + " · " + date);

    // FROM: the coordinates open the orbit map at this spot and moment
    var from = row("From", p.callsign + " @ ");
    var map = document.createElement("a");
    map.href = "map.html?" + new URLSearchParams({
      lat: p.lat.toFixed(2), lon: p.lon.toFixed(2),
      t: t.toISOString().slice(0, 16) + "Z", tz: p.zoneName,
      place: p.text.place || "", label: p.orbitName + " · Entry " + pad(p.entry, 3)
    });
    map.target = "_blank";
    map.rel = "noopener";
    map.textContent = ll + " ↗";
    from.append(map, p.text.place ? " · " + p.text.place : "");

    // MET and weather share a row; the WX part disappears if the lookup fails
    var met = row("MET", "Day " + Math.floor(p.met / 86400));
    var wxPart = document.createElement("span");
    var wxKey = document.createElement("span");
    wxKey.className = "wxk";
    wxKey.textContent = "  ·  WX ";
    var wx = document.createElement("span");
    wx.textContent = p.text.weather || "…";
    wxPart.append(wxKey, wx);
    met.appendChild(wxPart);
    if (!p.text.weather) fetchWeather(p, wx);

    if (p.text.status) row("Stat", p.text.status);
    if (p.text.objective) row("Obj", p.text.objective);

    var end = line("d");
    end.textContent = ">> END OF PACKET";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "copy";
    btn.textContent = "[ Copy packet ]";
    btn.addEventListener("click", function () { copyPacket(hex(p.bytes).replace(/ /g, ""), btn); });
    end.appendChild(btn);
    var prompt = line("d");                                                   // fresh prompt: the cursor always sits at the very end
    prompt.textContent = ">> ";
    prompt.insertAdjacentHTML("beforeend", '<span class="cur"></span>');
  }

  // Copy the whole packet as hex. Inside a cross-site iframe the Clipboard API needs
  // allow="clipboard-write" on the iframe; otherwise fall back to the older copy command.
  function copyPacket(value, btn) {
    function said(msg) {
      btn.textContent = msg;
      setTimeout(function () { btn.textContent = "[ Copy packet ]"; }, 1800);
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = value;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      said(ok ? "[ Copied ]" : "[ Copy failed ]");
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(value).then(function () { said("[ Copied ]"); }, fallback);
    } else {
      fallback();
    }
  }

  render(decode(new URLSearchParams(location.search).get("p")));

  // Lines arrive one by one, like a packet coming in over the link
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  lines.forEach(function (el, i) {
    if (calm) el.classList.add("on");
    else setTimeout(function () { el.classList.add("on"); }, 120 + i * 140);
  });
</script>
</body>
</html>
